name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install ffmpeg
        # Not on the runner image. The voice module probes and decodes clips with it, and
        # without it those tests skip rather than fail -- which would quietly leave the
        # whole audio path unexercised in CI.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Tests
        # The suite trains real models, so it is slower than a unit-test suite and the
        # timeout above is set accordingly.
        run: uv run pytest -q -p no:warnings

      - name: Pipeline smoke test
        # Runs the data pipeline end to end on the synthetic source, which needs no
        # credentials and no network. Catches breakage that unit tests can miss, such as
        # a report template referring to a column the features no longer produce.
        env:
          DATA_SOURCE: synthetic
          SYNTHETIC_N_CUSTOMERS: "150"
          SYNTHETIC_N_INVOICES: "1500"
          ANONYMIZATION_SALT: ci-salt
        run: |
          uv run collection extract
          uv run collection ingest
          uv run collection dictionary
          uv run collection features
          uv run collection demo

      - name: Retrieval evaluation
        # Fails if a change to the knowledge base or the retriever drops retrieval quality.
        run: uv run collection rag

      - name: Responder evaluation
        # The template arm only: it needs no API key and no network, and it exercises the
        # whole generation path -- prompt assembly, answering, escalation and the
        # faithfulness measure. The LLM arm is run by hand, because a step that calls a
        # paid API on every pull request is a step that gets removed.
        run: uv run collection answer --responder template

      - name: Outbound composer evaluation
        # The template arm only, for the same reason as above. It exercises the whole
        # outbound path -- terms read from the instalment table, composition, the
        # compliance checker, the report -- and guards the property the design rests on:
        # a slot-filling composer must be compliant on every labelled brief.
        run: uv run collection outreach --composer template

      - name: Voice transcription evaluation
        # No model, no audio, no network: the sweep corrupts the labelled transcripts at a
        # controlled rate and measures what the rest of the pipeline loses. Guards the
        # control arm -- at zero corruption the references must come through exactly, and
        # if they do not, the error model and the measures have drifted apart and every
        # number below is meaningless.
        run: uv run collection voice

      - name: Multi-turn evaluation
        # Context strategies against the labelled dialogues, lexical arms only. Guards
        # the property the design rests on: adding context must never lose a passage the
        # customer's own words would have found.
        run: uv run collection answer --conversations --responder template
