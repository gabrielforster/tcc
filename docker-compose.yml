# Local infrastructure: Postgres (with pgvector), Redis and S3-compatible object storage.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collection-postgres
    environment:
      POSTGRES_USER: collection
      POSTGRES_PASSWORD: collection
      POSTGRES_DB: collection
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collection"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: collection-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Chainguard build: the upstream minio/minio image is no longer published to Docker Hub.
  # It ships no shell or curl, so there is no in-container healthcheck.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: collection-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: collection
      MINIO_ROOT_PASSWORD: collection-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
