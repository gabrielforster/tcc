[project]
name = "collection"
version = "0.1.0"
description = "Intelligent multi-agent debt collection system (thesis): data pipeline, predictive module, RAG and agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "tabulate>=0.9",
    "alembic>=1.13",
    "pgvector>=0.3",
    "boto3>=1.34",
    # Default, not an extra: the embedding model backs retrieval and memory for every
    # tenant, and the design accepted its install cost explicitly.
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1", "lightgbm>=4.5", "imbalanced-learn>=0.12", "shap>=0.46"]
api = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
rag = ["pypdf>=4.2", "python-docx>=1.1"]
llm = ["anthropic>=0.40"]
voice = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "httpx2>=0.28"]

[project.scripts]
collection = "collection.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collection"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: needs Postgres"]
